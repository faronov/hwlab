# Espressif native USB Serial/JTAG on an ESP32-S3 (303a:1001) through the
# NATIVE Go stack: Linux usbfs -> Espressif USB-JTAG transport -> JTAG ->
# Xtensa On-Chip-Debug (two Xtensa LX7 TAPs, one per core). No OpenOCD, no
# Python, no ESP-IDF, no libusb, no CGO. See ADR 0038 and
# docs/notes/phase28-esp32s3-xtensa-debug-results.md.
#
# Run it with the board in ROM DOWNLOAD MODE (hold BOOT, press RESET). An
# application that uses the USB port itself (USB OTG, TinyUSB, e.g. an audio
# bridge) switches USB-Serial/JTAG off while it runs, and the board is gone
# from 303a:1001 until it is put back into download mode.
#
#   hwlab devices                         # espusbjtag/303a:1001:<serial>
#   hwlab run --yes examples/espusbjtag-s3.yaml
#
# Non-destructive: halt, registers, single-step, a hardware breakpoint in the
# download-mode ROM poll loop (0x40041a7c, observed on the validation board;
# another ROM revision may loop elsewhere - the step output shows the loop),
# memory and flash READS (the flash pins are attached for the call and put
# back), then resume. Nothing is written to memory or flash, nothing is
# erased, no eFuse is written and nothing resets the chip. Core 1 is held in
# reset in download mode and reports "unavailable".
name: espusbjtag-s3
duration: 16s

devices:
  jtag:
    plugin: espusbjtag

steps:
  - {name: info, at: 100ms, device: jtag, call: JTAGTransport.info}
  - {name: scan, at: 500ms, device: jtag, call: JTAGScan.scan, args: {measure_ir: true}}
  - {name: identify, at: 1s, device: jtag, call: TargetIdentify.identify}
  - {name: chip-info, at: 1500ms, device: jtag, call: DebugProbe.chip_info}
  - {name: cores, at: 2s, device: jtag, call: DebugProbe.harts}
  - {name: halt, at: 2500ms, device: jtag, call: DebugProbe.halt}
  - {name: registers, at: 3s, device: jtag, call: DebugProbe.read_registers, args: {keep_halted: true}}
  - {name: rom-chip-word, at: 3500ms, device: jtag, call: MemoryAccess.read, args: {address: 0x40001000, length: 4}}
  - {name: read-dram, at: 4s, device: jtag, call: MemoryAccess.read, args: {address: 0x3fc88000, length: 16}}
  - {name: step, at: 4500ms, device: jtag, call: DebugProbe.step, args: {count: 3}}
  - {name: breakpoint-hit, at: 5500ms, device: jtag, call: DebugProbe.set_breakpoint, args: {address: 0x40041a7c, run_wait_ms: 1000}}
  - {name: list-breakpoints, at: 7s, device: jtag, call: DebugProbe.list_breakpoints}
  - {name: clear-breakpoints, at: 7500ms, device: jtag, call: DebugProbe.clear_breakpoint, args: {all: true}}
  - {name: resume, at: 8s, device: jtag, call: DebugProbe.resume}
  - {name: flash-info, at: 9s, device: jtag, call: FlashProgramming.info}
  - {name: flash-read-bootloader-header, at: 11s, device: jtag, call: FlashProgramming.read, args: {address: 0x0, length: 32}}
  - {name: chip-info-after, at: 13s, device: jtag, call: DebugProbe.chip_info}
